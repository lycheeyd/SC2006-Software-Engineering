# application.properties in Account Module
server.port=8084
#spring.devtools.restart.enabled=false

# Logging level
logging.level.org.springframework=INFO

# Database settings
#spring.datasource.url=jdbc:mysql://172.21.146.188:1000/Calowin
#spring.datasource.username=calowin
#spring.datasource.password=meowmeow

# CALOWIN_SECURE database configuration
spring.datasource.calowinsecuredb.url=jdbc:sqlserver://172.21.146.188:1001;databaseName=CalowinSecure;encrypt=true;trustServerCertificate=true
spring.datasource.calowinsecuredb.username=calowinsecure
spring.datasource.calowinsecuredb.password=meowmeowsecure
spring.datasource.calowinsecuredb.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# CALOWIN database configuration
spring.datasource.calowindb.url=jdbc:sqlserver://172.21.146.188:1000;databaseName=Calowin;encrypt=true;trustServerCertificate=true
spring.datasource.calowindb.username=calowin
spring.datasource.calowindb.password=meowmeow
spring.datasource.calowindb.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Atomikos properties
spring.jta.atomikos.properties.service=auto
spring.jta.atomikos.properties.log-base-dir=./atomikos-logs
spring.jta.atomikos.properties.max-actives=50

# JPA and Hibernate settings (applies globally)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Calowin Notification Module configuration
notification.module.urlPrefix=http://localhost:8084  # Base URL for Calowin Notification service
